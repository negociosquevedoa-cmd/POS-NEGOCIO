<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Caja - QUEVEDO ABARROTES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .caja-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 380px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .badge {
            background-color: #166534;
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #4ade80;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }
        .monedas-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .moneda-item {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
        }
        .moneda-item label {
            font-size: 12px;
            margin-bottom: 4px;
        }
        .moneda-item input {
            font-size: 14px;
            padding: 8px;
        }
        .total-calculado {
            background-color: #1e3a8a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #38bdf8;
        }
        .total-calculated {
            font-size: 24px;
            color: #4ade80;
            font-weight: bold;
        }
        button {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <div class="caja-card">
        <h2>QUEVEDO ABARROTES</h2>
        <p>Apertura Turno de Caja</p>

        <div>
            Estado actual: <span class="badge" id="estado-caja">PENDIENTE APERTURA</span>
        </div>

        <div class="form-group">
            <label>Monto Inicial en Caja (S/):</label>
            <div class="total-calculated" id="monto-inicial">S/ 0.00</div>
        </div>

        <div class="form-group">
            <label style="margin-bottom: 10px;">Detalle de Monedas y Billetes:</label>
            <div class="monedas-grid">
                <div class="moneda-item">
                    <label>0.10 céntimos:</label>
                    <input type="number" id="mon-010" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>0.20 céntimos:</label>
                    <input type="number" id="mon-020" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>0.50 céntimos:</label>
                    <input type="number" id="mon-050" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>1 sol:</label>
                    <input type="number" id="mon-1" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>2 soles:</label>
                    <input type="number" id="mon-2" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>5 soles:</label>
                    <input type="number" id="mon-5" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>10 soles:</label>
                    <input type="number" id="mon-10" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>20 soles:</label>
                    <input type="number" id="mon-20" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
                <div class="moneda-item">
                    <label>50 soles:</label>
                    <input type="number" id="mon-50" value="0" min="0" step="1" oninput="calcularTotalMonedas()">
                </div>
            </div>
        </div>

        <div class="total-calculado">
            <label>Total Calculado:</label>
            <div class="total-calculated" id="total-calculado">S/ 0.00</div>
        </div>

        <button id="btn-apertura" onclick="guardarAperturaYContinuar()">Guardar Apertura e Iniciar Ventas</button>
        <p id="aviso-horario" style="display:none; color:#fca5a5; margin:12px 0 0;">El horario de caja para vendedores es de 7:00 a. m. a 8:00 p. m.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function obtenerFechaCaja() {
            const hoy = new Date();
            return `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
        }

        const usuarioActual = (localStorage.getItem('usuario_rol') || 'administrador').trim().toLowerCase();
        const esAdministrador = usuarioActual === 'administrador' || usuarioActual === 'admin';
        const claveSesionCaja = `caja_sesion_${usuarioActual}`;
        const fechaCajaHoy = obtenerFechaCaja();
        const estadoCaja = document.getElementById('estado-caja');
        const botonApertura = document.getElementById('btn-apertura');
        const avisoHorario = document.getElementById('aviso-horario');
        botonApertura.disabled = true;
        const supabaseClient = window.supabase
            ? window.supabase.createClient(
                'https://nxiviidirmzqbcldegus.supabase.co',
                'sb_publishable_Qf-bMKqDet0Xgh6PHExtsA_s3g0jXzn'
            )
            : null;
        let sesionDia = null;

        function obtenerSesionLocal() {
            try {
                return JSON.parse(localStorage.getItem(claveSesionCaja)) || null;
            } catch (error) {
                return null;
            }
        }

        function dentroHorarioVendedor() {
            const hora = new Date().getHours();
            return hora >= 7 && hora < 20;
        }

        function actualizarHorario() {
            const permitido = esAdministrador || dentroHorarioVendedor();
            avisoHorario.style.display = permitido ? 'none' : 'block';
            botonApertura.disabled = !permitido;
            return permitido;
        }

        async function verificarEstadoCajaUsuario() {
            let sesion = obtenerSesionLocal();
            if (supabaseClient && navigator.onLine) {
                try {
                    const { data, error } = await supabaseClient
                        .from('sesion_actual')
                        .select('*')
                        .eq('usuario', usuarioActual)
                        .eq('fecha_operativa', fechaCajaHoy)
                        .limit(1)
                        .maybeSingle();
                    if (error) throw error;
                    if (data) {
                        sesion = data;
                        localStorage.setItem(claveSesionCaja, JSON.stringify(data));
                    }
                } catch (error) {
                    console.error('No se pudo consultar la sesión de caja del usuario:', error);
                }
            }

            if (sesion && sesion.fecha_operativa === fechaCajaHoy) {
                sesionDia = sesion;
                window.location.replace('index.html');
                return;
            }
            estadoCaja.textContent = 'PENDIENTE APERTURA';
            estadoCaja.style.backgroundColor = '#854d0e';
            actualizarHorario();
        }

        verificarEstadoCajaUsuario();
        window.setInterval(actualizarHorario, 60 * 1000);

        function calcularTotalMonedas() {
            const denominaciones = [
                ['mon-010', 10], ['mon-020', 20], ['mon-050', 50], ['mon-1', 100],
                ['mon-2', 200], ['mon-5', 500], ['mon-10', 1000], ['mon-20', 2000], ['mon-50', 5000]
            ];
            const totalCentimos = denominaciones.reduce((total, [id, centimos]) => {
                const cantidad = Number(document.getElementById(id).value);
                return total + (Number.isInteger(cantidad) && cantidad > 0 ? cantidad * centimos : 0);
            }, 0);
            const totalCalculado = (totalCentimos / 100).toFixed(2);
            document.getElementById('total-calculado').textContent = 'S/ ' + totalCalculado;
            document.getElementById('monto-inicial').textContent = 'S/ ' + totalCalculado;
            return totalCalculado;
        }

        async function guardarAperturaYContinuar() {
            if (!actualizarHorario()) {
                alert('El horario de caja para vendedores es de 7:00 a. m. a 8:00 p. m.');
                return;
            }
            const entradas = document.querySelectorAll('.monedas-grid input');
            if ([...entradas].some(input => !Number.isInteger(Number(input.value)) || Number(input.value) < 0)) {
                alert("Ingrese cantidades enteras no negativas para las monedas y billetes.");
                return;
            }
            if (sesionDia || (obtenerSesionLocal()?.fecha_operativa === fechaCajaHoy)) {
                window.location.replace('index.html');
                return;
            }

            const monto = calcularTotalMonedas();

            // Guardamos el detalle de monedas
            const detalleMonedas = {
                '010': document.getElementById('mon-010').value || 0,
                '020': document.getElementById('mon-020').value || 0,
                '050': document.getElementById('mon-050').value || 0,
                '1': document.getElementById('mon-1').value || 0,
                '2': document.getElementById('mon-2').value || 0,
                '5': document.getElementById('mon-5').value || 0,
                '10': document.getElementById('mon-10').value || 0,
                '20': document.getElementById('mon-20').value || 0,
                '50': document.getElementById('mon-50').value || 0
            };

            const sesion = {
                usuario: usuarioActual,
                fecha_operativa: fechaCajaHoy,
                fecha_apertura: new Date().toISOString(),
                fecha_cierre: null,
                estado: 'ABIERTA',
                monto_inicial: Number(monto),
                total_efectivo: 0,
                total_yape: 0,
                total_gastos: 0,
                monto_final: 0,
                detalle_monedas: detalleMonedas,
                ventas: [],
                salidas: []
            };

            if (supabaseClient && navigator.onLine) {
                try {
                    const { data, error } = await supabaseClient
                        .from('sesion_actual')
                        .insert(sesion)
                        .select('*')
                        .single();
                    if (error) throw error;
                    Object.assign(sesion, data);
                    const { error: errorMovimiento } = await supabaseClient
                        .from('kardex_caja')
                        .insert({
                            fecha: sesion.fecha_apertura,
                            tipo: 'APERTURA',
                            monto: sesion.monto_inicial,
                            descripcion: `Apertura de caja ${sesion.fecha_operativa}`,
                            usuario: usuarioActual
                        });
                    if (errorMovimiento) throw errorMovimiento;
                } catch (error) {
                    console.error('No se pudo registrar la apertura de caja en Supabase:', error);
                    alert('No se pudo registrar la apertura en Supabase. Verifique la conexión e intente nuevamente. ' + error.message);
                    return;
                }
            }

            localStorage.setItem(claveSesionCaja, JSON.stringify(sesion));

            // Mensaje de confirmación e ingreso al panel de ventas
            alert("Apertura registrada con S/ " + monto + ". ¡Listo para vender!");
            window.location.href = "index.html";
        }

        calcularTotalMonedas();
    </script>
</body>
</html>
