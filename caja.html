<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apertura de Caja - QUEVEDO ABARROTES</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .caja-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            width: 380px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-bottom: 5px; color: #38bdf8; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .badge {
            background-color: #166534;
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .form-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #4ade80;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #15803d; }
    </style>
</head>
<body>

    <div class="caja-card">
        <h2>QUEVEDO ABARROTES</h2>
        <p>Apertura Turno de Caja</p>

        <div>
            Estado actual: <span class="badge">ABIERTA</span>
        </div>

        <div class="form-group">
            <label>Monto Inicial en Caja (S/):</label>
            <input type="number" id="monto-inicial" value="100.00" step="0.01">
        </div>

        <button onclick="guardarAperturaYContinuar()">Guardar Apertura e Iniciar Ventas</button>
    </div>

    <script>
        function guardarAperturaYContinuar() {
            const monto = document.getElementById('monto-inicial').value;
            
            if (!monto || monto < 0) {
                alert("Por favor ingrese un monto inicial válido.");
                return;
            }

            // Guardamos el monto de la caja localmente para usarlo durante la jornada
            localStorage.setItem('caja_inicial', monto);
            
            // Mensaje de confirmación e ingreso al panel de ventas
            alert("Apertura registrada con S/ " + monto + ". ¡Listo para vender!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
